name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK and NDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.0.12077973" "cmake;3.22.1" 2>&1 | tail -5
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Assemble debug
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build-output.log
          exit ${PIPESTATUS[0]}

      - name: Assemble release
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        run: gradle :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee -a build-output.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log

      - name: Upload APKs
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Glua-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 90

      - name: Fail if assemble failed
        if: steps.assemble.outcome != 'success'
        run: exit 1
